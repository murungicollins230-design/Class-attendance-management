<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Class Attendance · MUST</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">
        <span class="mark">MUST</span>
        <h1>Class Attendance Management System</h1>
        <p>SWE2106 · Etivity 5 · Group G</p>
      </div>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email address" autocomplete="username" required />
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
        <div class="error-note" id="login-error"></div>
        <button type="submit" class="gold">Log in</button>
      </form>

      <div class="demo-accounts">
        <h4>Demo accounts (click to fill)</h4>
        <div id="demo-list"></div>
        <p class="inline-note">All data is fictional demonstration data.</p>
      </div>
    </div>
  </div>

<div class="footer-bottom">  
  <p>&copy; <span id="footer-year">2026</span> Class Attendance Management System. All rights reserved to Group G.</p>
</div>
  
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
