# ---------------------------------------------------------------------
# MySQL instance dedicated to the SWE2106 Class Attendance project.
#
# It runs on port 3307 so it never conflicts with an existing MySQL
# Windows service (e.g. MySQL80 on port 3306). Start it with:
#     database\start-database.cmd
# ---------------------------------------------------------------------
[mysqld]
basedir="C:/wamp64/bin/mysql/mysql8.4.7"
datadir="D:/Desktop/New WEB/class-attendance-system/database/mysql-data"
port=3307
bind-address=127.0.0.1
mysqlx_port=33071
max_allowed_packet=32M
